<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E1116">
  <meta name="description" content="Trueface SDK documentation — Android, iOS, and core libraries.">

  <meta property="og:title" content="Trueface SDK Docs">
  <meta property="og:description" content="Guides, references, and samples for the Trueface SDK.">
  <meta property="og:type" content="website">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trueface Docs">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Trueface SDK Docs</title>

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0E1116; }
    #loader {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #0E1116;
      transition: opacity 200ms ease;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #8B95A5;
      font-size: 13px;
    }
    #loader.hide { opacity: 0; pointer-events: none; }
  </style>
</head>

<body>
  <div id="loader">Loading documentation…</div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loader');
      if (el) {
        el.classList.add('hide');
        setTimeout(function () { el.remove(); }, 250);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
